name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # 1. Asegurar que Docker está listo
      - name: Start Docker
        run: sudo systemctl start docker

      # 2. Verificar que las imágenes existen en Docker Hub
      - name: Check Docker Images
        run: |
          docker manifest inspect nginx:1.25-alpine > /dev/null || exit 1
          docker manifest inspect postgres:15 > /dev/null || exit 1

      # 3. Terraform Init & Apply (crea los contenedores)
      - name: Terraform Apply
        run: |
          terraform init
          terraform apply -auto-approve -input=false
        env:
          TF_VAR_nginx_port: 8080
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      # 4. Comprobar que los contenedores están corriendo
      - name: Verify Containers
        run: |
          sleep 5 # Dar tiempo a que arranquen
          docker ps | grep web
          docker ps | grep db
